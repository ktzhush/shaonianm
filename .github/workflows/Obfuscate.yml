name: Build cfnew shaonian

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install dependencies
        run: |
          npm install -g javascript-obfuscator
          sudo apt-get install -y unzip

      - name: Download and extract latest BPB worker
        run: |
          wget -O origin.js https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/refs/heads/main/Vless_workers_pages/_worker.js

      - name: 校验下载并处理 _worker.js
        run: |
          # 1. 校验下载是否成功
          if [ ! -s origin.js ]; then
            echo "::error::下载失败，origin.js 不存在或为空"
            exit 1
          fi
          echo "下载成功，文件大小：$(wc -c < origin.js) 字节"
          # 2. 替换 UUID
          sed -i 's/86c50e3a-5b87-49dd-bd20-03c7f2735e40/06c30f4d-99c9-4bc6-84ce-d992213a469c/g' origin.js
          # 3. 删除旧的 _worker.js
          rm -f _worker.js
          # 4. 重命名 origin.js 为 _worker.js
          mv origin.js _worker.js
          echo "处理完成，_worker.js 大小：$(wc -c < _worker.js) 字节"

      - name: 提交更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: ':arrow_up: update latest shaonian'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          push_options: '--set-upstream'

name: Build cfnew shaonian

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: 下载并处理 _worker.js
        run: |
          # 1. 下载上游已混淆的 _worker.js
          wget --tries=3 --timeout=30 -O origin.js https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/refs/heads/main/Vless_workers_pages/_worker.js

          # 2. 校验下载
          if [ ! -s origin.js ]; then
            echo "::error::下载失败，origin.js 不存在或为空"
            exit 1
          fi

          # 3. 替换 UUID 与 proxyIPs
          sed -i 's/86c50e3a-5b87-49dd-bd20-03c7f2735e40/06c30f4d-99c9-4bc6-84ce-d992213a469c/g; s/pyip.ygkkk.dpdns.org/p.etime.vip/g' origin.js

          # 4. 校验替换
          grep -q '06c30f4d-99c9-4bc6-84ce-d992213a469c' origin.js || { echo '::error::UUID 替换失败'; exit 1; }
          grep -q 'p.etime.vip' origin.js || { echo '::error::proxyIPs 替换失败'; exit 1; }

          # 5. 替换 _worker.js
          mv -f origin.js _worker.js
          echo "处理完成，_worker.js 大小：$(wc -c < _worker.js) 字节"

      - name: 提交更改
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: ':arrow_up: update latest shaonian'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          push_options: '--set-upstream'
